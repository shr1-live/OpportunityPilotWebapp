<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profiles mobile QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #111827; color: #f8fafc; font: 14px/1.4 system-ui, sans-serif; }
      main { display: flex; align-items: flex-start; gap: 24px; }
      figure { margin: 0; display: grid; gap: 8px; }
      figcaption { font-weight: 700; }
      img { display: block; width: 375px; height: auto; border: 1px solid #475569; background: white; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source issue · narrow, one-column type cards</figcaption>
        <img src="design-reference-profile-mobile.png" alt="Original mobile profile screenshot" />
      </figure>
      <figure>
        <figcaption>Implementation · 375 px, light theme</figcaption>
        <img src="design-qa-mobile-light.png" alt="Corrected mobile profile screen" />
      </figure>
    </main>
  </body>
</html>
